<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        /* CSS for styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #eef0f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .converter {
            background: rgb(240, 242, 243);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            color: #333;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="converter">
        <h1>Currency Converter</h1>
        <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
        <select id="fromCurrency">
            <!-- Options populated by JavaScript -->
        </select>
        <select id="toCurrency">
            <!-- Options populated by JavaScript -->
        </select>
        <button id="convertBtn">Convert</button>
        <div id="result"></div>
    </div>

    <script>
        // JavaScript for functionality

        // Comprehensive list of currencies (ISO 4217 codes and names)
        const currencies = {

            "BBD": "Barbadian Dollar",
            "BDT": "Bangladeshi Taka",

            "CHF": "Swiss Franc",
            "CLF": "Chilean Unit of Account (UF)",
            "CLP": "Chilean Peso",
            "CNH": "Chinese Yuan (Offshore)",

            "ETB": "Ethiopian Birr",

            "FJD": "Fijian Dollar",
            "FKP": "Falkland Islands Pound",
            "GBP": "British Pound Sterling",
            "GEL": "Georgian Lari",
            "GGP": "Guernsey Pound",

            "GIP": "Gibraltar Pound",
            "GMD": "Gambian Dalasi",

            "HTG": "Haitian Gourde",
            "HUF": "Hungarian Forint",
            "IDR": "Indonesian Rupiah",
            "ILS": "Israeli New Sheqel",
            "IMP": "Manx pound",
            "INR": "Indian Rupee",
            "IQD": "Iraqi Dinar",
            "IRR": "Iranian Rial",
            "ISK": "Icelandic Króna",
            "JEP": "Jersey Pound",
            "JMD": "Jamaican Dollar",
            "JOD": "Jordanian Dinar",

            "STN": "São Tomé and Príncipe Dobra",
            "SVC": "Salvadoran Colón",
            "SYP": "Syrian Pound",
            "SZL": "Swazi Lilangeni",
            "THB": "Thai Baht",
            "TJS": "Tajikistani Somoni",
            "TMT": "Turkmenistani Manat",
            "TND": "Tunisian Dinar",
            "TOP": "Tongan Pa'anga",
            "TRY": "Turkish Lira",
            "TTD": "Trinidad and Tobago Dollar",
            "TWD": "New Taiwan Dollar",
            "TZS": "Tanzanian Shilling",
            "UAH": "Ukrainian Hryvnia",
            "UGX": "Ugandan Shilling",
            "USD": "United States Dollar",
            "UYU": "Uruguayan Peso",
            "UZS": "Uzbekistan Som",
            "VES": "Venezuelan Bolívar Soberano",
            "VND": "Vietnamese Dong",
            "VUV": "Vanuatu Vatu",
            "WST": "Samoan Tala",
            "XAF": "CFA Franc BEAC",
            "XAG": "Silver Ounce",
            "XAU": "Gold Ounce",
            "XCD": "East Caribbean Dollar",
            "XDR": "Special Drawing Rights",
            "XOF": "CFA Franc BCEAO",
            "XPD": "Palladium Ounce",
            "XPF": "CFP Franc",
            "XPT": "Platinum Ounce",
            "YER": "Yemeni Rial",
            "ZAR": "South African Rand",
            "ZMW": "Zambian Kwacha",
            "ZWL": "Zimbabwean Dollar"
        };

        // Populate the select dropdowns with currencies
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        for (const [code, name] of Object.entries(currencies)) {
            const option1 = document.createElement('option');
            option1.value = code;
            option1.textContent = `${code} - ${name}`;
            fromSelect.appendChild(option1);

            const option2 = document.createElement('option');
            option2.value = code;
            option2.textContent = `${code} - ${name}`;
            toSelect.appendChild(option2);
        }

        // Set default selections
        fromSelect.value = 'USD';
        toSelect.value = 'EUR';

        // Conversion logic
        document.getElementById('convertBtn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('amount').value);
            const from = fromSelect.value;
            const to = toSelect.value;
            const resultDiv = document.getElementById('result');

            if (isNaN(amount) || amount <= 0) {
                resultDiv.innerHTML = '<span class="error">Please enter a valid amount.</span>';
                return;
            }

            try {
                // Fetch exchange rates from API (rates are against USD)
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();
                const rates = data.rates;

                // Calculate conversion: amount in 'from' to USD, then to 'to'
                const amountInUSD = amount / rates[from];
                const convertedAmount = amountInUSD * rates[to];

                resultDiv.innerHTML = `${amount} ${from} = ${convertedAmount.toFixed(2)} ${to}`;
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">Error fetching rates. Please try again later.</span>';
                console.error(error);
            }
        });
    </script>
</body>
</html>
